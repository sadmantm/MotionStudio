<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: {{w}}px;
    height: {{h}}px;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    font-family: {{fontFamily}};
  }

  .text-stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: {{bg}};
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---- Glass card ---- */
  @keyframes card_in {
    0% {
      opacity: 0;
      transform: translateY(40px) scale(0.94);
      filter: blur(12px);
    }
    60% {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(-6px) scale(1.01);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }
  }

  @keyframes card_out {
    0% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }
    100% {
      opacity: 0;
      transform: translateY(-28px) scale(0.96);
      filter: blur(8px);
    }
  }

  /* Reuse same names for the system */
  @keyframes ms_in {
    0%   { opacity: 0; transform: translateY(40px) scale(0.94); filter: blur(12px); }
    60%  { opacity: 1; filter: blur(0px); transform: translateY(-6px) scale(1.01); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
  }
  @keyframes ms_out {
    0%   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
    100% { opacity: 0; transform: translateY(-28px) scale(0.96); filter: blur(8px); }
  }

  /* Floating orbs for depth behind card */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    pointer-events: none;
  }
  .orb-a {
    width: 340px; height: 340px;
    top: -80px; right: -60px;
    background: radial-gradient(circle, {{color}} 0%, transparent 70%);
  }
  .orb-b {
    width: 280px; height: 280px;
    bottom: -60px; left: -40px;
    background: radial-gradient(circle, rgba(255,255,255,0.5) 0%, transparent 70%);
  }

  .glass-card {
    position: relative;
    width: 88%;
    max-width: 920px;

    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);

    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 28px;

    padding: 48px 56px;

    box-shadow:
      0 8px 32px rgba(0,0,0,0.22),
      0 2px 8px rgba(0,0,0,0.12),
      inset 0 1px 0 rgba(255,255,255,0.35);

    opacity: 0;
    will-change: transform, opacity, filter;
  }

  /* Top-left corner accent */
  .glass-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 120px; height: 120px;
    border-radius: 28px 0 60px 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 60%);
    pointer-events: none;
  }

  #__txt_el {
    width: 100%;
    text-align: {{align}};
    font-family: 'DM Sans', {{fontFamily}};
    font-size: {{fontSize}}px;
    font-weight: {{fontWeight}};
    color: {{color}};

    line-height: 1.18;
    letter-spacing: -0.025em;

    white-space: pre-wrap;
    overflow-wrap: break-word;

    /* No explicit opacity — card controls it */
    text-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  /* Subtle label above text */
  .glass-card .card-label {
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: calc({{fontSize}}px * 0.28);
    font-weight: 500;
    color: {{color}};
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 14px;
  }
</style>
</head>
<body>
  <div class="text-stage">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>

    <div class="glass-card" id="__glass">
      <div id="__txt_el">{{text}}</div>
    </div>
  </div>

<script>
(function () {
  // For the glassmorphism template, the animated element is the card wrapper.
  // The spec requires id="__txt_el" for live text updates,
  // but we animate the card (#__glass) for the visual effect.
  const el    = document.getElementById('__glass');
  const txtEl = document.getElementById('__txt_el');

  let DUR = Number({{duration}}) || 4;
  let IN = Math.min(0.65, DUR * 0.16);
  let OUT = Math.min(0.5, DUR * 0.12);

  function recalcTiming() {
    IN = Math.min(0.65, DUR * 0.16);
    OUT = Math.min(0.5, DUR * 0.12);
  }

  function normalizeTime(t) {
    t = Number(t);
    return Number.isFinite(t) ? Math.max(0, t) : 0;
  }

  function clearMotionStyles() {
    el.style.animation = '';
    el.style.animationDelay = '';
    el.style.animationPlayState = '';
    el.style.opacity = '';
  }

  function reportSize() {
    const r = txtEl.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) { setTimeout(reportSize, 50); return; }
  }

  window.Motion = {
    config: {
      get durationInSeconds() { return DUR; },
      fps: 30
    },
    whenReady() { return Promise.resolve(); },
    setDuration(d) {
      d = Number(d);
      if (Number.isFinite(d) && d > 0) { DUR = d; recalcTiming(); }
    },
    seek(t) {
      t = normalizeTime(t);
      clearMotionStyles();
      if (t <= 0) { el.style.opacity = '0'; return; }
      if (t <= IN) {
        el.style.animation = 'ms_in ' + IN + 's cubic-bezier(0.16, 1, 0.3, 1) forwards';
        el.style.animationDelay = (-t) + 's';
        el.style.animationPlayState = 'paused';
        return;
      }
      if (t >= DUR - OUT) {
        const tOut = t - (DUR - OUT);
        el.style.animation = 'ms_out ' + OUT + 's ease forwards';
        el.style.animationDelay = (-tOut) + 's';
        el.style.animationPlayState = 'paused';
        return;
      }
      el.style.opacity = '1';
    }
  };

  window.Motion.seek(0);
  if (document.fonts?.ready) { document.fonts.ready.then(reportSize); }
  else { setTimeout(reportSize, 120); }
  window.addEventListener('resize', reportSize);
  window.__reportTextSize = reportSize;
})();
</script>
</body>
</html>
