<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root { --hl: #82ea00; --hl: {{highlightColor}}; }

  html, body {
    width: {{w}}px;
    height: {{h}}px;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    font-family: {{fontFamily}};
  }

  /* Faixa inferior (lower-third). bottom/padding são definidos no script
     conforme a proporção do projeto (9:16, 1:1, 16:9). */
  .cap-safe {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .cap-block {
    display: inline-block;
    max-width: 100%;
    background: {{bg}};
    border-radius: 0.22em;
    transform-origin: 50% 100%;
    opacity: 0;
    font-size: {{fontSize}}px;
  }

  #__txt_el {
    display: block;
    text-align: {{align}};
    font-family: {{fontFamily}};
    font-size: {{fontSize}}px;
    font-weight: {{fontWeight}};
    color: {{color}};
    line-height: 1.18;
    letter-spacing: 0.005em;
    white-space: normal;
    overflow-wrap: break-word;
    word-spacing: -0.12em;  /* compensa o padding das caixas */
    /* Contorno + sombra para ler sobre qualquer vídeo */
    text-shadow:
      0.045em 0 0 rgba(0,0,0,.9), -0.045em 0 0 rgba(0,0,0,.9),
      0 0.045em 0 rgba(0,0,0,.9), 0 -0.045em 0 rgba(0,0,0,.9),
      0.032em 0.032em 0 rgba(0,0,0,.9), -0.032em 0.032em 0 rgba(0,0,0,.9),
      0.032em -0.032em 0 rgba(0,0,0,.9), -0.032em -0.032em 0 rgba(0,0,0,.9),
      0 0.09em 0.22em rgba(0,0,0,.55);
  }

  .cw {
    position: relative;
    display: inline-block;
    padding: 0 0.12em;
    transform-origin: 50% 60%;
    will-change: transform;
  }

  /* Caixa arredondada atrás da palavra ativa */
  .cw .bx {
    position: absolute;
    left: 0;
    right: 0;
    top: 0.04em;
    bottom: 0.02em;
    border-radius: 0.2em;
    background: var(--hl);
    opacity: 0;
    z-index: 0;
    box-shadow: 0 0.06em 0.18em rgba(0,0,0,.35);
  }

  .cw .tx {
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="cap-safe" id="__cap_safe">
    <div class="cap-block" id="__cap_block">
      <div id="__txt_el">{{text}}</div>
    </div>
  </div>

<script type="application/json" id="__words">{{wordsJson}}</script>

<script>
(function () {
  'use strict';

  // Tudo aqui é função pura de t: sem rAF, timers ou Date.now (export/WVC).
  var W   = Number('{{w}}') || 1080;
  var H   = Number('{{h}}') || 1920;
  var FPS = 30;
  var DUR = Number('{{duration}}') || 2;
  // Cor de destaque vem de uma CSS custom property (vazia/inválida → padrão)
  var HIGHLIGHT = getComputedStyle(document.documentElement).getPropertyValue('--hl').trim();
  if (!HIGHLIGHT || !(window.CSS && CSS.supports && CSS.supports('color', HIGHLIGHT))) HIGHLIGHT = '#82ea00';
  document.documentElement.style.setProperty('--hl', HIGHLIGHT);

  // Texto sobre a caixa: preto ou branco, o que tiver mais contraste
  var ON_BOX = (function () {
    var probe = document.createElement('span');
    probe.style.color = HIGHLIGHT;
    document.body.appendChild(probe);
    var m = getComputedStyle(probe).color.match(/[\d.]+/g) || [255, 255, 255];
    probe.remove();
    function lin(c) { c = Number(c) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
    var L = 0.2126 * lin(m[0]) + 0.7152 * lin(m[1]) + 0.0722 * lin(m[2]);
    return L > 0.36 ? '#0b0b0b' : '#ffffff';
  })();

  var safe  = document.getElementById('__cap_safe');
  var block = document.getElementById('__cap_block');
  var el    = document.getElementById('__txt_el');

  // ── Área segura (UI do TikTok/Reels/Shorts no 9:16; títulos no 16:9) ──
  (function layoutSafeArea() {
    var ratio = H / W;
    var bottom, side;
    if (ratio >= 1.4)      { bottom = H * 0.22; side = W * 0.08; }  // 9:16 / 4:5
    else if (ratio >= 0.9) { bottom = H * 0.14; side = W * 0.08; }  // 1:1
    else                   { bottom = H * 0.10; side = W * 0.12; }  // 16:9
    safe.style.bottom       = Math.round(bottom) + 'px';
    safe.style.paddingLeft  = Math.round(side) + 'px';
    safe.style.paddingRight = Math.round(side) + 'px';
    var align = getComputedStyle(el).textAlign;
    safe.style.justifyContent =
      align === 'left' || align === 'start' ? 'flex-start'
        : align === 'right' || align === 'end' ? 'flex-end' : 'center';
    // Fundo opcional (param bg) vira uma "pílula" atrás da legenda
    var bg = getComputedStyle(block).backgroundColor || '';
    var transparent = !bg || bg === 'transparent' || /rgba\([^)]*,\s*0\)$/.test(bg);
    if (!transparent) block.style.padding = '0.14em 0.42em 0.18em';
  })();

  // ── Texto → palavras ─────────────────────────────────────────
  function readText(node) {
    var out = '';
    node.childNodes.forEach(function (child) {
      if (child.nodeType === 3) out += child.nodeValue;
      else if (child.nodeName === 'BR') out += '\n';
      else if (child.nodeType === 1) out += readText(child);
    });
    return out;
  }

  function readWordsJson() {
    try {
      var raw = (document.getElementById('__words') || {}).textContent || '';
      if (!raw.trim()) return null;
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : null;
    } catch (_) {
      return null;
    }
  }

  var JSON_WORDS = readWordsJson();
  var words = [];   // { el, start, end }
  var sentinel = null;
  var builtFor = null;

  function evenTimings(tokens) {
    var lead = Math.min(0.08, DUR * 0.04);
    var tail = Math.min(0.30, DUR * 0.15);
    var span = Math.max(0.05, DUR - lead - tail);
    var weights = tokens.map(function (w) { return w.replace(/[^\p{L}\p{N}]/gu, '').length + 2; });
    var total = weights.reduce(function (a, b) { return a + b; }, 0) || 1;
    var acc = lead;
    return weights.map(function (wgt) {
      var s = acc;
      acc += span * wgt / total;
      return { start: s, end: acc };
    });
  }

  function jsonTimings(count) {
    if (!JSON_WORDS || JSON_WORDS.length !== count) return null;
    var out = [];
    for (var i = 0; i < count; i++) {
      var s = Number(JSON_WORDS[i] && JSON_WORDS[i].start);
      var e = Number(JSON_WORDS[i] && JSON_WORDS[i].end);
      if (!isFinite(s)) return null;
      if (!isFinite(e) || e < s) e = s;
      s = Math.max(0, Math.min(DUR, s));
      e = Math.max(s, Math.min(DUR, e));
      if (i > 0 && s < out[i - 1].start) s = out[i - 1].start;
      out.push({ start: s, end: e });
    }
    return out;
  }

  function build() {
    var text = readText(el).replace(/\r/g, '');
    var lines = text.split('\n');
    var tokens = [];
    var frag = document.createDocumentFragment();

    lines.forEach(function (line, li) {
      var parts = line.split(/\s+/).filter(Boolean);
      parts.forEach(function (word, wi) {
        var span = document.createElement('span');
        span.className = 'cw';
        var box = document.createElement('span');
        box.className = 'bx';
        var tx = document.createElement('span');
        tx.className = 'tx';
        tx.textContent = word;
        span.appendChild(box);
        span.appendChild(tx);
        frag.appendChild(span);
        if (wi < parts.length - 1) frag.appendChild(document.createTextNode(' '));
        tokens.push({ word: word, el: span });
      });
      if (li < lines.length - 1 && parts.length) frag.appendChild(document.createElement('br'));
    });

    sentinel = document.createElement('span');
    sentinel.style.display = 'none';
    frag.appendChild(sentinel);

    el.textContent = '';
    el.appendChild(frag);

    var times = jsonTimings(tokens.length) || evenTimings(tokens.map(function (t) { return t.word; }));
    words = tokens.map(function (t, i) {
      return {
        el: t.el,
        box: t.el.firstChild,
        tx: t.el.lastChild,
        start: times[i].start,
        end: times[i].end,
      };
    });
    builtFor = DUR;
  }

  function ensureBuilt() {
    // texts.js troca o innerHTML de #__txt_el ao editar → reconstrói.
    if (!sentinel || sentinel.parentNode !== el || builtFor !== DUR) build();
  }

  // ── Easings ──────────────────────────────────────────────────
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function easeOutCubic(p) { p = clamp(p, 0, 1); return 1 - Math.pow(1 - p, 3); }
  function easeOutBack(p) {
    p = clamp(p, 0, 1);
    var c1 = 1.9, c3 = c1 + 1;
    return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
  }

  var BOX_POP = 0.14;       // duração do "pop" da caixa
  var ACTIVE_SCALE = 1.06;  // escala da palavra ativa

  function seek(t) {
    t = Number(t);
    if (!isFinite(t) || t < 0) t = 0;
    ensureBuilt();

    // Entrada/saída do bloco inteiro
    var IN  = Math.min(0.12, DUR * 0.15);
    var OUT = Math.min(0.12, DUR * 0.12);
    var blockOpacity = 1;
    var blockShift = 0;
    if (t <= 0) blockOpacity = 0;
    else if (t < IN) { var pi = easeOutCubic(t / IN); blockOpacity = pi; blockShift = (1 - pi) * 0.25; }
    if (t > DUR - OUT) blockOpacity = Math.min(blockOpacity, clamp((DUR - t) / Math.max(0.001, OUT), 0, 1));
    block.style.opacity = String(blockOpacity);
    block.style.transform = 'translateY(' + blockShift.toFixed(4) + 'em)';

    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      var next = words[i + 1];
      // A caixa fica na palavra até a próxima começar (sem "buracos").
      var activeEnd = next ? Math.max(w.end, next.start) : Math.max(w.end, w.start + 0.25);
      var active = t >= w.start && t < activeEnd;
      var bs = w.box.style;
      var ts = w.tx.style;

      if (!active) {
        bs.opacity = '0';
        bs.transform = 'scale(0.8)';
        ts.color = '';
        ts.textShadow = '';
        w.el.style.transform = '';
        // Ainda não falada: levemente apagada; já falada: normal
        w.el.style.opacity = t < w.start ? '0.82' : '1';
        continue;
      }

      var local = t - w.start;
      var pop = easeOutBack(local / BOX_POP);
      bs.opacity = String(clamp(local / (BOX_POP * 0.35), 0, 1));
      bs.transform = 'scale(' + (0.8 + 0.2 * pop).toFixed(4) + ')';
      ts.color = ON_BOX;
      ts.textShadow = 'none';
      w.el.style.opacity = '1';
      w.el.style.transform = 'scale(' + (1 + (ACTIVE_SCALE - 1) * pop).toFixed(4) + ')';
    }
  }

  function fontsReady() {
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    var cs = getComputedStyle(el);
    var spec = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    return Promise.all([
      document.fonts.load(spec, readText(el) || 'Aa'),
      document.fonts.ready,
    ]).then(function () {}, function () {});
  }

  var readyPromise = null;

  window.Motion = {
    config: {
      get durationInSeconds() { return DUR; },
      fps: FPS,
      get totalFrames() { return Math.round(DUR * FPS); },
    },
    whenReady: function () {
      if (!readyPromise) readyPromise = fontsReady();
      return readyPromise;
    },
    setDuration: function (d) {
      d = Number(d);
      if (isFinite(d) && d > 0) { DUR = d; build(); }
    },
    seek: seek,
    renderFrame: function (f) { seek((Number(f) || 0) / FPS); },
  };

  build();
  seek(0);
})();
</script>
</body>
</html>
