<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: {{w}}px;
    height: {{h}}px;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    font-family: {{fontFamily}};
  }

  .text-stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: {{bg}};
  }

  .text-safe-area {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes ms_in {
    0%   { opacity: 0; transform: translate(-50%, -50%) translateY(100%); }
    100% { opacity: 1; transform: translate(-50%, -50%) translateY(0%); }
  }

  @keyframes ms_out {
    0%   { opacity: 1; transform: translate(-50%, -50%) translateY(0%); }
    100% { opacity: 0; transform: translate(-50%, -50%) translateY(-80%); }
  }

  /* Linha decorativa */
  #__txt_el::before {
    content: "";
    position: absolute;
    bottom: -14px;
    left: {{align}} == "center" ? "50%" : "0";
    width: 64px;
    height: 4px;
    border-radius: 2px;
    background: {{color}};
    opacity: 0.7;
  }

  #__txt_el {
    position: absolute;
    top: 50%; left: 50%;
    width: 84%;
    max-width: 960px;
    transform: translate(-50%, -50%);
    text-align: {{align}};
    font-family: {{fontFamily}};
    font-size: {{fontSize}}px;
    font-weight: {{fontWeight}};
    color: {{color}};
    line-height: 1.1;
    letter-spacing: -0.04em;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    opacity: 0;
    will-change: transform, opacity;
    overflow: hidden;
    padding-bottom: 24px;
    text-shadow:
      0 2px 8px rgba(0,0,0,0.4),
      0 8px 32px rgba(0,0,0,0.3);
  }
</style>
</head>

<body>
  <div class="text-stage">
    <div class="text-safe-area">
      <div id="__txt_el">{{text}}</div>
    </div>
  </div>

<script>
(function () {
  const el = document.getElementById('__txt_el');
  let DUR = Number({{duration}}) || 4;
  let IN = Math.min(0.55, DUR * 0.15);
  let OUT = Math.min(0.45, DUR * 0.12);

  function recalcTiming() {
    IN = Math.min(0.55, DUR * 0.15);
    OUT = Math.min(0.45, DUR * 0.12);
  }

  function normalizeTime(t) {
    t = Number(t);
    return Number.isFinite(t) ? Math.max(0, t) : 0;
  }

  function clearMotionStyles() {
    el.style.animation = '';
    el.style.animationDelay = '';
    el.style.animationPlayState = '';
    el.style.opacity = '';
  }

  function reportSize() {
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) { setTimeout(reportSize, 50); return; }
  }

  window.Motion = {
    config: {
      get durationInSeconds() { return DUR; },
      fps: 30
    },
    whenReady() { return Promise.resolve(); },
    setDuration(d) {
      d = Number(d);
      if (Number.isFinite(d) && d > 0) { DUR = d; recalcTiming(); }
    },
    seek(t) {
      t = normalizeTime(t);
      clearMotionStyles();
      if (t <= 0) { el.style.opacity = '0'; return; }
      if (t <= IN) {
        el.style.animation = 'ms_in ' + IN + 's cubic-bezier(0.16,1,0.3,1) forwards';
        el.style.animationDelay = (-t) + 's';
        el.style.animationPlayState = 'paused';
        return;
      }
      if (t >= DUR - OUT) {
        const tOut = t - (DUR - OUT);
        el.style.animation = 'ms_out ' + OUT + 's cubic-bezier(0.7,0,0.84,0) forwards';
        el.style.animationDelay = (-tOut) + 's';
        el.style.animationPlayState = 'paused';
        return;
      }
      el.style.opacity = '1';
    }
  };

  window.Motion.seek(0);
  if (document.fonts?.ready) { document.fonts.ready.then(reportSize); }
  else { setTimeout(reportSize, 120); }
  window.addEventListener('resize', reportSize);
  window.__reportTextSize = reportSize;
})();
</script>
</body>
</html>
