<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: {{w}}px;
    height: {{h}}px;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    font-family: {{fontFamily}};
  }

  .text-stage {
    position: absolute;
    inset: 0;
    background: {{bg}};
  }

  .text-safe-area {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  /* Máscara tipo typewriter: revela da esquerda */
  @keyframes ms_in {
    0%   { clip-path: inset(0 100% 0 0); opacity: 1; }
    100% { clip-path: inset(0 0% 0 0);   opacity: 1; }
  }

  /* Saída: apaga da direita para esquerda */
  @keyframes ms_out {
    0%   { clip-path: inset(0 0% 0 0);   opacity: 1; }
    100% { clip-path: inset(0 100% 0 0); opacity: 0; }
  }

  /* Cursor piscando */
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* Cursor como pseudo-elemento AFTER */
  #__txt_el::after {
    content: "|";
    display: inline-block;
    margin-left: 4px;
    color: {{color}};
    font-weight: 300;
    animation: blink 0.8s step-end infinite;
    opacity: 1;
  }

  #__txt_el {
    position: absolute;
    top: 50%; left: 50%;
    width: 86%;
    max-width: 960px;
    transform: translate(-50%, -50%);
    text-align: {{align}};
    font-family: {{fontFamily}};
    font-size: {{fontSize}}px;
    font-weight: {{fontWeight}};
    color: {{color}};
    line-height: 1.1;
    letter-spacing: 0.01em;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    opacity: 0;
    will-change: clip-path, opacity;
    text-shadow:
      0 0 24px rgba(255,255,255,0.15),
      0 3px 10px rgba(0,0,0,0.5);
  }
</style>
</head>

<body>
  <div class="text-stage">
    <div class="text-safe-area">
      <div id="__txt_el">{{text}}</div>
    </div>
  </div>

<script>
(function () {
  const el = document.getElementById('__txt_el');
  let DUR = Number({{duration}}) || 4;
  let IN = Math.min(0.9, DUR * 0.22);
  let OUT = Math.min(0.6, DUR * 0.15);

  function recalcTiming() {
    IN = Math.min(0.9, DUR * 0.22);
    OUT = Math.min(0.6, DUR * 0.15);
  }

  function normalizeTime(t) {
    t = Number(t);
    return Number.isFinite(t) ? Math.max(0, t) : 0;
  }

  function clearMotionStyles() {
    el.style.animation = '';
    el.style.animationDelay = '';
    el.style.animationPlayState = '';
    el.style.opacity = '';
    el.style.clipPath = '';
  }

  function reportSize() {
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) { setTimeout(reportSize, 50); return; }
  }

  window.Motion = {
    config: {
      get durationInSeconds() { return DUR; },
      fps: 30
    },
    whenReady() { return Promise.resolve(); },
    setDuration(d) {
      d = Number(d);
      if (Number.isFinite(d) && d > 0) { DUR = d; recalcTiming(); }
    },
    seek(t) {
      t = normalizeTime(t);
      clearMotionStyles();

      if (t <= 0) { el.style.opacity = '0'; return; }

      if (t <= IN) {
        el.style.opacity = '1';
        el.style.animation = 'ms_in ' + IN + 's steps(40, end) forwards';
        el.style.animationDelay = (-t) + 's';
        el.style.animationPlayState = 'paused';
        return;
      }

      if (t >= DUR - OUT) {
        const tOut = t - (DUR - OUT);
        el.style.opacity = '1';
        el.style.animation = 'ms_out ' + OUT + 's steps(40, end) forwards';
        el.style.animationDelay = (-tOut) + 's';
        el.style.animationPlayState = 'paused';
        return;
      }

      el.style.opacity = '1';
    }
  };

  window.Motion.seek(0);
  if (document.fonts?.ready) { document.fonts.ready.then(reportSize); }
  else { setTimeout(reportSize, 120); }
  window.addEventListener('resize', reportSize);
  window.__reportTextSize = reportSize;
})();
</script>
</body>
</html>
