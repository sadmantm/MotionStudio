<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: {{w}}px;
    height: {{h}}px;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    font-family: {{fontFamily}};
  }

  .text-stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: {{bg}};
  }

  .text-safe-area {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  @keyframes ms_in {
    0% {
      opacity: 0;
      transform: translate(-50%, calc(-50% + 30px));
      filter: blur(8px);
      letter-spacing: 0.18em;
    }
    55% {
      opacity: 0.9;
      filter: blur(0px);
      letter-spacing: 0.06em;
    }
    100% {
      opacity: 1;
      transform: translate(-50%, -50%);
      filter: blur(0px);
      letter-spacing: 0.04em;
    }
  }

  @keyframes ms_out {
    0% {
      opacity: 1;
      transform: translate(-50%, -50%);
      filter: blur(0px);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, calc(-50% - 20px));
      filter: blur(6px);
      letter-spacing: 0.12em;
    }
  }

  @keyframes shimmer_move {
    0%   { background-position: -200% center; }
    100% { background-position: 300% center; }
  }

  /* Decorative top rule line */
  #__txt_el::before {
    content: "";
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 48%;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      {{color}} 30%,
      #fff8e7 50%,
      {{color}} 70%,
      transparent 100%
    );
    opacity: 0.7;
  }

  /* Decorative bottom rule line */
  #__txt_el::after {
    content: "";
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 48%;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      {{color}} 30%,
      #fff8e7 50%,
      {{color}} 70%,
      transparent 100%
    );
    opacity: 0.7;
  }

  #__txt_el {
    position: absolute;
    top: 50%;
    left: 50%;

    width: 88%;
    max-width: 960px;

    transform: translate(-50%, -50%);

    text-align: {{align}};
    font-family: 'Playfair Display', {{fontFamily}};
    font-size: {{fontSize}}px;
    font-weight: {{fontWeight}};

    /* Gold shimmer gradient applied to text */
    background: linear-gradient(
      105deg,
      #b8943f 0%,
      {{color}} 20%,
      #fff0a0 38%,
      #ffe680 44%,
      #fff5b0 50%,
      #ffe680 56%,
      {{color}} 70%,
      #b8943f 85%,
      {{color}} 100%
    );
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;

    animation: shimmer_move 4s linear infinite;

    line-height: 1.15;
    letter-spacing: 0.04em;

    white-space: pre-wrap;
    overflow-wrap: break-word;

    opacity: 0;
    will-change: transform, opacity, filter;

    filter: drop-shadow(0 2px 18px rgba(200,160,40,0.45))
            drop-shadow(0 0px 6px rgba(200,160,40,0.3));
  }
</style>
</head>
<body>
  <div class="text-stage">
    <div class="text-safe-area">
      <div id="__txt_el">{{text}}</div>
    </div>
  </div>

<script>
(function () {
  const el = document.getElementById('__txt_el');
  let DUR = Number({{duration}}) || 4;
  let IN = Math.min(0.65, DUR * 0.16);
  let OUT = Math.min(0.5, DUR * 0.12);

  function recalcTiming() {
    IN = Math.min(0.65, DUR * 0.16);
    OUT = Math.min(0.5, DUR * 0.12);
  }

  function normalizeTime(t) {
    t = Number(t);
    return Number.isFinite(t) ? Math.max(0, t) : 0;
  }

  function clearMotionStyles() {
    el.style.animation = '';
    el.style.animationDelay = '';
    el.style.animationPlayState = '';
    el.style.opacity = '';
  }

  function reportSize() {
    if (!el) return;
    const r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) { setTimeout(reportSize, 50); return; }
  }

  window.Motion = {
    config: {
      get durationInSeconds() { return DUR; },
      fps: 30
    },
    whenReady() { return Promise.resolve(); },
    setDuration(d) {
      d = Number(d);
      if (Number.isFinite(d) && d > 0) { DUR = d; recalcTiming(); }
    },
    seek(t) {
      t = normalizeTime(t);
      clearMotionStyles();
      if (t <= 0) { el.style.opacity = '0'; return; }
      if (t <= IN) {
        el.style.animation = 'ms_in ' + IN + 's cubic-bezier(0.16, 1, 0.3, 1) forwards';
        el.style.animationDelay = (-t) + 's';
        el.style.animationPlayState = 'paused';
        return;
      }
      if (t >= DUR - OUT) {
        const tOut = t - (DUR - OUT);
        el.style.animation = 'ms_out ' + OUT + 's ease forwards';
        el.style.animationDelay = (-tOut) + 's';
        el.style.animationPlayState = 'paused';
        return;
      }
      el.style.opacity = '1';
    }
  };

  window.Motion.seek(0);
  if (document.fonts?.ready) { document.fonts.ready.then(reportSize); }
  else { setTimeout(reportSize, 120); }
  window.addEventListener('resize', reportSize);
  window.__reportTextSize = reportSize;
})();
</script>
</body>
</html>
