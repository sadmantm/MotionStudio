<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Syne+Mono&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: {{w}}px;
    height: {{h}}px;
    overflow: hidden;
    background: transparent;
  }

  body {
    position: relative;
    font-family: {{fontFamily}};
  }

  .text-stage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: {{bg}};
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ==== CARD ==== */
  @keyframes ms_in {
    0% {
      opacity: 0;
      transform: translateY(50px) scale(0.92);
      filter: blur(10px);
    }
    55% {
      opacity: 1;
      filter: blur(0px);
      transform: translateY(-8px) scale(1.015);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: blur(0px);
    }
  }

  @keyframes ms_out {
    0%   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0px); }
    100% { opacity: 0; transform: translateY(-32px) scale(0.96); filter: blur(8px); }
  }

  /* Phone shake animation */
  @keyframes phone_ring {
    0%,  100% { transform: rotate(0deg) scale(1); }
    10%        { transform: rotate(-18deg) scale(1.08); }
    20%        { transform: rotate(16deg)  scale(1.08); }
    30%        { transform: rotate(-14deg) scale(1.05); }
    40%        { transform: rotate(12deg)  scale(1.05); }
    50%        { transform: rotate(-8deg)  scale(1.02); }
    60%        { transform: rotate(6deg)   scale(1.02); }
    70%        { transform: rotate(-4deg); }
    80%        { transform: rotate(2deg); }
  }

  /* WhatsApp pulse ring */
  @keyframes wa_pulse {
    0%   { transform: scale(1);    opacity: 0.7; }
    70%  { transform: scale(1.55); opacity: 0; }
    100% { transform: scale(1.55); opacity: 0; }
  }

  /* Number digit reveal */
  @keyframes digit_slide {
    0%   { opacity: 0; transform: translateY(18px); filter: blur(4px); }
    100% { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  /* CTA pulse */
  @keyframes cta_glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(37,211,102,0.5); }
    50%       { box-shadow: 0 0 0 14px rgba(37,211,102,0); }
  }

  /* ---- Card shell ---- */
  .contact-card {
    position: relative;
    width: 86%;
    max-width: 880px;
    opacity: 0;
    will-change: transform, opacity, filter;

    background: linear-gradient(145deg, #1a1a2e 0%, #16213e 55%, #0f3460 100%);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 32px;
    padding: 42px 52px 44px;

    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      0 4px 16px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.08);
  }

  /* Top-right glow blob */
  .contact-card::before {
    content: "";
    position: absolute;
    top: -40px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(37,211,102,0.2) 0%, transparent 70%);
    filter: blur(30px);
    pointer-events: none;
  }

  /* ---- Top row: icons ---- */
  .card-icons {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }

  .icon-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    border-radius: 18px;
    flex-shrink: 0;
  }

  /* Phone icon bg */
  .icon-phone {
    background: linear-gradient(135deg, #e94560 0%, #c72040 100%);
    box-shadow: 0 6px 20px rgba(233,69,96,0.45);
  }

  /* WhatsApp icon bg */
  .icon-wa {
    background: linear-gradient(135deg, #25d366 0%, #128c50 100%);
    box-shadow: 0 6px 20px rgba(37,211,102,0.45);
  }

  .icon-phone svg,
  .icon-wa svg {
    width: 34px;
    height: 34px;
    fill: #fff;
  }

  /* Pulse ring on WhatsApp */
  .wa-pulse-ring {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    border: 2px solid rgba(37,211,102,0.6);
    animation: wa_pulse 2s ease-out infinite;
    pointer-events: none;
  }

  /* Divider */
  .icon-divider {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,0.12) 0%, transparent 100%);
  }

  /* Atende badge */
  .atende-badge {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    white-space: nowrap;
  }

  /* ---- Label above number ---- */
  .card-label {
    font-family: 'Syne', sans-serif;
    font-size: calc({{fontSize}}px * 0.26);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 10px;
  }

  /* ---- Phone number (main text) ---- */
  #__txt_el {
    width: 100%;
    text-align: {{align}};
    font-family: 'Syne Mono', 'Syne', {{fontFamily}};
    font-size: {{fontSize}}px;
    font-weight: {{fontWeight}};
    color: {{color}};

    line-height: 1.05;
    letter-spacing: 0.06em;

    white-space: pre-wrap;
    overflow-wrap: break-word;

    text-shadow: 0 2px 20px rgba(255,255,255,0.15);
  }

  /* ---- Bottom CTA button ---- */
  .card-cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 28px;
    padding: 14px 28px;
    background: linear-gradient(135deg, #25d366 0%, #128c50 100%);
    border-radius: 50px;
    font-family: 'Syne', sans-serif;
    font-size: calc({{fontSize}}px * 0.27);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff;
    text-transform: uppercase;
    animation: cta_glow 2.2s ease-in-out infinite;
  }

  .card-cta svg {
    width: 20px;
    height: 20px;
    fill: #fff;
  }

  /* Ring animation on phone icon — triggered by JS class */
  .icon-phone.ringing svg {
    animation: phone_ring 0.8s ease-in-out;
  }
</style>
</head>
<body>
  <div class="text-stage">
    <div class="contact-card" id="__glass">

      <!-- Icons row -->
      <div class="card-icons">
        <!-- Phone icon -->
        <div class="icon-wrap icon-phone" id="__phone_icon">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1L6.6 10.8z"/>
          </svg>
        </div>

        <!-- WhatsApp icon -->
        <div class="icon-wrap icon-wa">
          <div class="wa-pulse-ring"></div>
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
          </svg>
        </div>

        <div class="icon-divider"></div>
        <div class="atende-badge">Atendimento</div>
      </div>

      <!-- Label -->
      <div class="card-label">Entre em contato</div>

      <!-- Main number text -->
      <div id="__txt_el">{{text}}</div>

      <!-- CTA -->
      <div class="card-cta">
        <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
        Chamar no WhatsApp
      </div>

    </div>
  </div>

<script>
(function () {
  const card    = document.getElementById('__glass');
  const txtEl   = document.getElementById('__txt_el');
  const phoneIcon = document.getElementById('__phone_icon');

  let DUR = Number({{duration}}) || 5;
  let IN  = Math.min(0.7, DUR * 0.14);
  let OUT = Math.min(0.5, DUR * 0.10);

  // Trigger phone ring once at 1s mark
  let ringFired = false;

  function recalcTiming() {
    IN  = Math.min(0.7, DUR * 0.14);
    OUT = Math.min(0.5, DUR * 0.10);
  }

  function normalizeTime(t) {
    t = Number(t);
    return Number.isFinite(t) ? Math.max(0, t) : 0;
  }

  function clearMotionStyles() {
    card.style.animation = '';
    card.style.animationDelay = '';
    card.style.animationPlayState = '';
    card.style.opacity = '';
  }

  function triggerRing() {
    phoneIcon.classList.remove('ringing');
    void phoneIcon.offsetWidth; // reflow
    phoneIcon.classList.add('ringing');
    phoneIcon.addEventListener('animationend', () => phoneIcon.classList.remove('ringing'), { once: true });
  }

  function reportSize() {
    const r = txtEl.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) { setTimeout(reportSize, 50); return; }
  }

  window.Motion = {
    config: {
      get durationInSeconds() { return DUR; },
      fps: 30
    },
    whenReady() { return Promise.resolve(); },
    setDuration(d) {
      d = Number(d);
      if (Number.isFinite(d) && d > 0) { DUR = d; recalcTiming(); }
    },
    seek(t) {
      t = normalizeTime(t);
      clearMotionStyles();

      if (t <= 0) {
        card.style.opacity = '0';
        ringFired = false;
        return;
      }

      // Fire ring once when past 1.2s
      if (t >= 1.2 && !ringFired) {
        ringFired = true;
        triggerRing();
      }
      if (t < 1.2) {
        ringFired = false;
      }

      if (t <= IN) {
        card.style.animation = 'ms_in ' + IN + 's cubic-bezier(0.16, 1, 0.3, 1) forwards';
        card.style.animationDelay = (-t) + 's';
        card.style.animationPlayState = 'paused';
        return;
      }

      if (t >= DUR - OUT) {
        const tOut = t - (DUR - OUT);
        card.style.animation = 'ms_out ' + OUT + 's ease forwards';
        card.style.animationDelay = (-tOut) + 's';
        card.style.animationPlayState = 'paused';
        return;
      }

      card.style.opacity = '1';
    }
  };

  window.Motion.seek(0);
  if (document.fonts?.ready) { document.fonts.ready.then(reportSize); }
  else { setTimeout(reportSize, 120); }
  window.addEventListener('resize', reportSize);
  window.__reportTextSize = reportSize;
})();
</script>
</body>
</html>
